<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour Studio Custom Fitting Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #10b981;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }
    .header { background: linear-gradient(135deg, #064e3b, #0f172a); padding: 24px 16px; text-align: center; border-bottom: 2px solid var(--accent-green); }
    .header h1 { font-size: 1.6rem; font-weight: 800; color: #fff; }
    .header p { font-size: 0.9rem; color: var(--accent-blue); margin-top: 6px; }
    .tabs { display: flex; overflow-x: auto; background-color: #111827; border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; min-width: 120px; padding: 14px 8px; text-align: center; background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--accent-green); border-bottom-color: var(--accent-green); background-color: rgba(16, 185, 129, 0.05); }
    .container { max-width: 800px; margin: 0 auto; padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .card h3 { font-size: 1.1rem; color: var(--accent-green); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; margin-top: 10px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-run { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 16px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
    .badge-shaft { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
    .badge-head { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-gold); }
    .rec-item { background: #0f172a; border-radius: 8px; padding: 14px; margin-bottom: 12px; border-left: 4px solid var(--accent-blue); }
    .rec-item a { color: var(--accent-green); font-size: 0.85rem; text-decoration: none; display: inline-block; margin-top: 6px; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 10px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .highlight-box { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TOUR STUDIO CUSTOM FITTING</h1>
    <p>Professional Ball Flight, Biometrics & Marketplace Diagnostics</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">1. Biometrics</button>
    <button class="tab-btn" onclick="switchTab(1)">2. Current Gear</button>
    <button class="tab-btn" onclick="switchTab(2)">3. Flight Dynamics</button>
    <button class="tab-btn" onclick="switchTab(3)">4. Video / Photos</button>
    <button class="tab-btn" onclick="switchTab(4)">5. Diagnostic Report</button>
  </div>

  <div class="container">
    <!-- TAB 1 -->
    <div class="tab-content active" id="tab-0">
      <div class="card">
        <h3>Player Profile & Biometrics</h3>
        <div class="grid-2">
          <div>
            <label>Height (Inches)</label>
            <input type="number" id="height" value="70" />
          </div>
          <div>
            <label>Wrist-to-Floor (Inches)</label>
            <input type="number" id="wtf" value="35" />
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>Driver Swing Speed (mph)</label>
            <input type="number" id="speed" value="96" />
          </div>
          <div>
            <label>Tempo Profile</label>
            <select id="tempo">
              <option value="Smooth">Smooth (Deliberate)</option>
              <option value="Moderate" selected>Moderate (Standard)</option>
              <option value="Aggressive">Aggressive (Quick Transition)</option>
            </select>
          </div>
        </div>
        <button class="btn-run" onclick="switchTab(1)">Next: Current Gear →</button>
      </div>
    </div>

    <!-- TAB 2 -->
    <div class="tab-content" id="tab-1">
      <div class="card">
        <h3>Current Club Audit</h3>
        <label>Driver Head Model</label>
        <select id="driver_head">
          <option>Callaway Paradym Ai Smoke</option>
          <option>Callaway Rogue ST Max</option>
          <option>TaylorMade Qi10</option>
          <option>TaylorMade Stealth 2</option>
          <option>Titleist TSR2 / TSR3</option>
          <option selected>Ping G430 Max</option>
          <option>Ping G425 Max</option>
          <option>Cobra LTDx / Darkspeed</option>
        </select>
        <label>Current Driver Shaft</label>
        <select id="driver_shaft">
          <option>Mitsubishi Tensei AV Blue 65</option>
          <option>Fujikura Ventus Blue 6S (Velocore)</option>
          <option>Fujikura Ventus Black 6X</option>
          <option>Project X HZRDUS Smoke Black 60</option>
          <option selected>Ping Alta CB 55 Slate</option>
          <option>UST Mamiya Helium 5F3</option>
        </select>
        <button class="btn-run" onclick="switchTab(2)">Next: Flight Dynamics →</button>
      </div>
    </div>

    <!-- TAB 3 -->
    <div class="tab-content" id="tab-2">
      <div class="card">
        <h3>Ball Flight & Miss Tendencies</h3>
        <div class="grid-2">
          <div>
            <label>Primary Shot Miss</label>
            <select id="miss_pattern">
              <option value="Slice">High Weak Slice</option>
              <option value="Hook">Low Snap Hook</option>
              <option value="Push">Push Right</option>
              <option value="Pull">Pull Left</option>
              <option value="Center" selected>Straight / Slight Fade</option>
            </select>
          </div>
          <div>
            <label>Launch Angle</label>
            <select id="launch_height">
              <option value="Low">Too Low</option>
              <option value="Optimal" selected>Optimal (12°-14°)</option>
              <option value="High">Too High / Ballooning</option>
            </select>
          </div>
        </div>
        <button class="btn-run" onclick="switchTab(3)">Next: Media Upload →</button>
      </div>
    </div>

    <!-- TAB 4 -->
    <div class="tab-content" id="tab-3">
      <div class="card">
        <h3>Swing Video / Clubhead Photos</h3>
        <label>Upload Swing Video (Down-the-line or Face-on)</label>
        <input type="file" accept="video/*" />
        <label>Upload Face Wear Photo (Impact dispersion)</label>
        <input type="file" accept="image/*" />
        <button class="btn-run" onclick="runDiagnostic()">Run Master Fitting Diagnostic ⚡</button>
      </div>
    </div>

    <!-- TAB 5 -->
    <div class="tab-content" id="tab-4">
      <div class="card">
        <h3>Fitting Engine Results</h3>
        <div id="spec_summary"></div>
        <canvas id="flightChart" style="max-height: 260px; margin: 16px 0;"></canvas>
        <div class="highlight-box" id="reshaft_box"></div>
      </div>

      <div class="card">
        <h3>Top 5 Marketplace Recommendations</h3>
        <div id="rec_list"></div>
      </div>

      <div class="card">
        <h3>Prescribed Swing Fault Drill</h3>
        <div id="video_drill"></div>
      </div>
    </div>
  </div>

  <script>
    let flightChart = null;

    function switchTab(index) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.tab-content').forEach((tab, i) => {
        tab.classList.toggle('active', i === index);
      });
      window.scrollTo(0, 0);
    }

    function runDiagnostic() {
      const height = parseFloat(document.getElementById('height').value);
      const wtf = parseFloat(document.getElementById('wtf').value);
      const speed = parseFloat(document.getElementById('speed').value);
      const miss = document.getElementById('miss_pattern').value;
      const launch = document.getElementById('launch_height').value;

      let flex = "Regular (R)";
      let weight = "55g - 60g";
      if (speed < 85) { flex = "Senior / Lite (A)"; weight = "45g - 50g"; }
      else if (speed > 105) { flex = "Extra Stiff (X)"; weight = "65g - 75g"; }
      else if (speed >= 95) { flex = "Stiff (S)"; weight = "60g - 65g"; }

      let lenAdj = "Standard (45.5\")";
      if (wtf < 34) lenAdj = "-0.50\" Under Standard";
      if (wtf > 36) lenAdj = "+0.50\" Over Standard";

      document.getElementById('spec_summary').innerHTML = `
        <p><strong>Recommended Driver Shaft Flex:</strong> <span style="color:var(--accent-green);">${flex}</span></p>
        <p><strong>Recommended Shaft Weight:</strong> ${weight}</p>
        <p><strong>Recommended Length:</strong> ${lenAdj}</p>
      `;

      document.getElementById('reshaft_box').innerHTML = `
        <strong>💡 Reshaft Cost-Benefit Analysis:</strong><br/>
        Keeping your current head and swapping only the shaft for ~$110–$140 delivers <strong>~92% of the total performance gain</strong> of a $600 brand-new club.
      `;

      const recs = [
        { name: "Fujikura Ventus TR Blue 6" + flex[0], type: "Shaft Only", price: "$140 - $185", link: "https://www.ebay.com/sch/i.html?_nkw=Fujikura+Ventus+Blue+shaft" },
        { name: "Mitsubishi Tensei 1K Pro White 60", type: "Shaft Only", price: "$120 - $160", link: "https://www.ebay.com/sch/i.html?_nkw=Tensei+1K+Pro+shaft" },
        { name: "Ping G430 LST / Max 10.5°", type: "Complete Club", price: "$340 - $410", link: "https://www.ebay.com/sch/i.html?_nkw=Ping+G430+Max+driver" },
        { name: "TaylorMade Qi10 LS Driver Head", type: "Head Only", price: "$290 - $340", link: "https://www.ebay.com/sch/i.html?_nkw=TaylorMade+Qi10+driver" },
        { name: "UST Mamiya LIN-Q M40X White", type: "Shaft Only", price: "$95 - $130", link: "https://www.ebay.com/sch/i.html?_nkw=UST+Mamiya+LIN-Q+shaft" }
      ];

      let recHtml = "";
      recs.forEach(r => {
        recHtml += `
          <div class="rec-item">
            <span class="badge ${r.type.includes('Shaft') ? 'badge-shaft' : 'badge-head'}">${r.type}</span>
            <div style="font-weight:700;">${r.name}</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">Est. Market Price: ${r.price}</div>
            <a href="${r.link}" target="_blank">Search Live eBay Listings ↗</a>
          </div>
        `;
      });
      document.getElementById('rec_list').innerHTML = recHtml;

      let drillId = "bagOs4vuLuo";
      if (miss === "Slice") drillId = "lbT1b3AQ0Rk";
      document.getElementById('video_drill').innerHTML = `
        <p style="font-size:0.85rem; color:var(--text-muted);">Custom drill matched to your primary shot tendency (${miss}):</p>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/${drillId}" frameborder="0" allowfullscreen></iframe>
        </div>
      `;

      renderChart(speed);
      switchTab(4);
    }

    function renderChart(speed) {
      const ctx = document.getElementById('flightChart').getContext('2d');
      if (flightChart) flightChart.destroy();

      const carry = Math.round(speed * 2.3);
      const points = [];
      for (let x = 0; x <= carry; x += 15) {
        const h = 32 * Math.sin((Math.PI * x) / carry);
        points.push({ x: x, y: Math.max(0, h) });
      }

      flightChart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Fitted Ball Trajectory (Yards / Apex)',
            data: points,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.15)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { type: 'linear', position: 'bottom', title: { display: true, text: 'Distance (Yards)', color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { title: { display: true, text: 'Height (Yards)', color: '#94a3b8' }, grid: { color: '#334155' }, min: 0, max: 45 }
          },
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }
  </script>
</body>
</html>
